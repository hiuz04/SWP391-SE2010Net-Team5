<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Bảng giá | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="owner" data-name="Owner A" data-active="Bảng giá"></div>
<main class="py-5">
    <div class="container"><h1 class="section-title mb-4">Quản lý bảng giá</h1>
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card soft-card p-4"><h5>Giờ thường</h5>
                    <p class="price-tag">300.000đ</p>
                    <p class="text-muted">06:00 - 17:00</p>
                    <button class="btn btn-outline-success">Cập nhật</button>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card soft-card p-4"><h5>Giờ cao điểm</h5>
                    <p class="price-tag">450.000đ</p>
                    <p class="text-muted">17:00 - 22:00</p>
                    <button class="btn btn-outline-success">Cập nhật</button>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card soft-card p-4"><h5>Cuối tuần</h5>
                    <p class="price-tag">500.000đ</p>
                    <p class="text-muted">Thứ 7 - Chủ nhật</p>
                    <button class="btn btn-outline-success">Cập nhật</button>
                </div>
            </div>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
