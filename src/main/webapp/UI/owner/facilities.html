<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Quản lý cơ sở | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="owner" data-name="Owner A" data-active="Cơ sở"></div>
<main class="py-5">

        </div>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card soft-card p-4"><h5>Cơ sở Quận 1</h5>
                    <p class="text-muted">123 Đường ABC, Quận 1</p><span

            </div>
            <div class="col-md-6">
                <div class="card soft-card p-4"><h5>Cơ sở Phú Nhuận</h5>
                    <p class="text-muted">456 Đường XYZ, Phú Nhuận</p><span class="badge badge-soft-warning">Bảo trì một phần</span>
                </div>
            </div>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
