<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Quản lý sân bóng | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="owner" data-name="Owner A" data-active="Sân bóng"></div>
<main class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between mb-4"><h1 class="section-title">Quản lý sân bóng</h1>
            <button class="btn btn-sf-primary">Thêm sân</button>
        </div>
        <div class="card table-card border-0 shadow-sm">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Sân</th>
                    <th>Loại</th>
                    <th>Giá/giờ</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Sân 5A</td>
                    <td>Sân 5</td>
                    <td>300.000đ</td>
                    <td><span class="badge badge-soft-success">Hoạt động</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary">Sửa</button>
                    </td>
                </tr>
                <tr>
                    <td>Sân 7B</td>
                    <td>Sân 7</td>
                    <td>450.000đ</td>
                    <td><span class="badge badge-soft-warning">Bảo trì</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary">Sửa</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
