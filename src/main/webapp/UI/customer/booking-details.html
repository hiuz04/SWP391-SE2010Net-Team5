<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Chi tiết booking | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="customer" data-name="Nguyễn Văn A" data-active="Lịch sử đặt sân"></div>

<main class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card soft-card p-4">
                    <div class="d-flex justify-content-between">
                        <div><h1 class="section-title">Booking #BK001</h1>
                            <p class="text-muted">Sân bóng Thể Thao A</p></div>
                        <span class="badge badge-soft-success align-self-start">Đã xác nhận</span></div>
                    <div class="timeline mt-4">
                        <div class="timeline-item"><strong>Tạo đơn đặt sân</strong>
                            <p class="text-muted mb-0">23/05/2026 09:20</p></div>
                        <div class="timeline-item"><strong>Thanh toán thành công</strong>
                            <p class="text-muted mb-0">23/05/2026 09:24</p></div>
                        <div class="timeline-item"><strong>Chờ check-in tại sân</strong>
                            <p class="text-muted mb-0">Xuất trình QR cho nhân viên</p></div>
                    </div>
                </div>
            </div>
            <aside class="col-lg-4">
                <div class="card soft-card p-4 text-center sidebar-card"><h5>Mã QR check-in</h5>
                    <div class="qr-box my-4"></div>
                    <p class="text-muted">Đưa mã này cho nhân viên sân để check-in.</p>
                    <button class="btn btn-outline-danger w-100" data-demo-alert="Đã gửi yêu cầu hủy booking demo.">Hủy
                        booking
                    </button>
                </div>
            </aside>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
