<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Tạo kèo | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="customer" data-name="Nguyễn Văn A" data-active=""></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card soft-card p-4"><h1 class="section-title">Tạo kèo giao hữu</h1>
                    <div class="row g-3 mt-2">
                        <div class="col-md-6"><label class="form-label">Tên đội</label><input class="form-control"
                                                                                              placeholder="FC Weekend">
                        </div>
                        <div class="col-md-6"><label class="form-label">Trình độ</label><select class="form-select">
                            <option>Trung bình</option>
                            <option>Mới chơi</option>
                            <option>Khá</option>
                        </select></div>
                        <div class="col-md-6"><label class="form-label">Ngày</label><input class="form-control"
                                                                                           type="date"></div>
                        <div class="col-md-6"><label class="form-label">Khung giờ</label><input class="form-control"
                                                                                                value="19:00 - 20:30">
                        </div>
                        <div class="col-12"><label class="form-label">Địa điểm</label><input class="form-control"
                                                                                             value="Sân Thể Thao A">
                        </div>
                        <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control"
                                                                                             rows="4"></textarea></div>
                    </div>
                    <button class="btn btn-sf-primary mt-4" data-demo-alert="Đã tạo kèo demo.">Đăng kèo</button>
                </div>
            </div>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
