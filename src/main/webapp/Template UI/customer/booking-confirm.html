<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Xác nhận đặt sân | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="customer" data-name="Nguyễn Văn A" data-active=""></div>

<main class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card soft-card p-4"><h1 class="section-title">Xác nhận thông tin đặt sân</h1>
                    <div class="row g-3 mt-2">
                        <div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control"
                                                                                             value="Nguyễn Văn A"></div>
                        <div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control"
                                                                                                    value="0901234567">
                        </div>
                        <div class="col-12"><label class="form-label">Ghi chú</label><textarea class="form-control"
                                                                                               rows="4"
                                                                                               placeholder="Yêu cầu thêm..."></textarea>
                        </div>
                    </div>
                    <h5 class="mt-4">Dịch vụ thêm</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="form-check border rounded-4 p-3"><input class="form-check-input ms-0 me-2"
                                                                                type="checkbox">Thuê bóng +30.000đ
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check border rounded-4 p-3"><input class="form-check-input ms-0 me-2"
                                                                                type="checkbox">Nước uống +50.000đ
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check border rounded-4 p-3"><input class="form-check-input ms-0 me-2"
                                                                                type="checkbox">Áo bib +40.000đ
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <aside class="col-lg-4">
                <div class="card soft-card p-4 sidebar-card"><h5>Thông tin booking</h5>
                    <div class="d-flex justify-content-between"><span>Sân</span><strong>Thể Thao A</strong></div>
                    <hr>
                    <div class="d-flex justify-content-between"><span>Ngày</span><strong>23/05/2026</strong></div>
                    <div class="d-flex justify-content-between"><span>Giờ</span><strong>18:00 - 19:00</strong></div>
                    <div class="d-flex justify-content-between"><span>Tiền sân</span><strong>300.000đ</strong></div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5"><span>Tổng</span><strong class="text-sf-primary">300.000đ</strong>
                    </div>
                    <a href="payment.html" class="btn btn-sf-primary btn-lg w-100 mt-4">Chọn thanh toán</a></div>
            </aside>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
