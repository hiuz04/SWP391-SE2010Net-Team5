<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Thanh toán | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="customer" data-name="Nguyễn Văn A" data-active=""></div>

<main class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card soft-card p-4"><h1 class="section-title">Chọn phương thức thanh toán</h1>
                    <div class="list-group mt-4"><label class="list-group-item d-flex gap-3 align-items-center"><input
                            class="form-check-input" type="radio" name="pay" checked><i
                            class="bi bi-bank fs-3 text-sf-primary"></i>
                        <div><strong>Chuyển khoản ngân hàng</strong>
                            <div class="text-muted small">Quét QR hoặc chuyển khoản thủ công</div>
                        </div>
                    </label><label class="list-group-item d-flex gap-3 align-items-center"><input
                            class="form-check-input" type="radio" name="pay"><i
                            class="bi bi-wallet2 fs-3 text-sf-primary"></i>
                        <div><strong>Ví điện tử</strong>
                            <div class="text-muted small">Momo/ZaloPay/VNPay</div>
                        </div>
                    </label><label class="list-group-item d-flex gap-3 align-items-center"><input
                            class="form-check-input" type="radio" name="pay"><i
                            class="bi bi-cash-coin fs-3 text-sf-primary"></i>
                        <div><strong>Thanh toán tại sân</strong>
                            <div class="text-muted small">Chỉ áp dụng với một số sân</div>
                        </div>
                    </label></div>
                </div>
            </div>
            <aside class="col-lg-4">
                <div class="card soft-card p-4 sidebar-card"><h5>Tổng thanh toán</h5>
                    <div class="d-flex justify-content-between"><span>Tiền sân</span><strong>300.000đ</strong></div>
                    <div class="d-flex justify-content-between"><span>Phí dịch vụ</span><strong>0đ</strong></div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5"><span>Tổng</span><strong class="text-sf-primary">300.000đ</strong>
                    </div>
                    <a href="payment-result.html" class="btn btn-sf-primary btn-lg w-100 mt-4">Thanh toán</a></div>
            </aside>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
