<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Hồ sơ | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="customer" data-name="Nguyễn Văn A" data-active="Hồ sơ"></div>

<main class="py-5">
    <div class="container">
        <div class="row g-4">
            <aside class="col-lg-4">
                <div class="card soft-card p-4 text-center"><img class="avatar-lg mx-auto"
                                                                 src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=240&q=80">
                    <h4 class="mt-3">Nguyễn Văn A</h4>
                    <p class="text-muted">Khách hàng thân thiết</p>
                    <div class="row g-2">
                        <div class="col">
                            <div class="stat-card p-3"><strong>12</strong>
                                <div class="small text-muted">Booking</div>
                            </div>
                        </div>
                        <div class="col">
                            <div class="stat-card p-3"><strong>4.9</strong>
                                <div class="small text-muted">Rating</div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
            <section class="col-lg-8">
                <div class="card soft-card p-4"><h1 class="section-title">Thông tin cá nhân</h1>
                    <div class="row g-3 mt-2">
                        <div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control"
                                                                                             value="Nguyễn Văn A"></div>
                        <div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control"
                                                                                                    value="0901234567">
                        </div>
                        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control"
                                                                                            value="user@example.com">
                        </div>
                        <div class="col-md-6"><label class="form-label">Ngày sinh</label><input class="form-control"
                                                                                                type="date"></div>
                        <div class="col-12"><label class="form-label">Địa chỉ</label><input class="form-control"
                                                                                            value="Quận 1, TP.HCM">
                        </div>
                    </div>
                    <button class="btn btn-sf-primary mt-4" data-demo-alert="Đã lưu hồ sơ demo.">Lưu thay đổi</button>
                </div>
            </section>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
