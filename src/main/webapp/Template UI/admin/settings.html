<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Cài đặt hệ thống | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="admin" data-name="Admin" data-active="Cài đặt"></div>
<main class="py-5">
    <div class="container"><h1 class="section-title mb-4">Cài đặt hệ thống</h1>
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card soft-card p-4"><h5>Cấu hình đặt sân</h5><label class="form-label mt-3">Thời gian giữ
                    chỗ</label><select class="form-select">
                    <option>15 phút</option>
                    <option>30 phút</option>
                </select><label class="form-label mt-3">Phí hủy trễ</label><input class="form-control" value="10%">
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card soft-card p-4"><h5>Cấu hình thanh toán</h5>
                    <div class="form-check form-switch mt-3"><input class="form-check-input" type="checkbox"
                                                                    checked><label class="form-check-label">Cho phép
                        thanh toán online</label></div>
                    <div class="form-check form-switch mt-3"><input class="form-check-input" type="checkbox"
                                                                    checked><label class="form-check-label">Gửi thông
                        báo email</label></div>
                    <button class="btn btn-sf-primary mt-4">Lưu cài đặt</button>
                </div>
            </div>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
