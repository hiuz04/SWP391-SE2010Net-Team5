<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<div class="container">
    <h2 id="formTitle"></h2>
    <form>
        <input type="hidden" name="facilityID" id="facilityID">

        <div>
            <label for="facName">Tên cơ sở</label>
            <input type="text" name="facilityName" id="facName" required>
        </div>

        <div>
            <label for="desc">Mô tả</label>
            <textarea name="description" rows="4" id="desc"></textarea>
        </div>

        <div>
            <label for="adrs">Địa chỉ</label>
            <input type="text" name="address" id="adrs" required>
        </div>

        <div>
            <label for="ward">Phường/Xã</label>
            <input type="text" name="ward" id="ward">
        </div>


        <div>
            <label for="city">Tỉnh/Thành phố</label>
            <input type="text" name="city" id="city">
        </div>

        <div>
            <label for="lat">Vĩ độ (Latitude)</label>
            <input type="number"
                   name="latitude"
                   step="0.0000001"
                   min="-90"
                   max="90"
                   id="lat">
        </div>

        <div>
            <label for="long">Kinh độ (Longitude)</label>
            <input type="number"
                   name="longitude"
                   step="0.0000001"
                   min="-180"
                   max="180"
                   id="long">
        </div>

        <div>
            <label for="hotln">Hotline</label>
            <input type="text" name="hotline" id="hotln">
        </div>

        <div>
            <label for="opTime">Giờ mở cửa</label>
            <input type="time" name="openingTime" id="opTime">
        </div>

        <div>
            <label for="clsTime">Giờ đóng cửa</label>
            <input type="time" name="closingTime" id="clsTime">
        </div>

        <div>
            <label for="rule">Nội quy chung</label>
            <textarea name="generalRules" rows="4" id="rule"></textarea>
        </div>

        <div>
            <label for="status">Trạng thái</label>
            <select name="status" id="status">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
                <option value="MAINTENANCE">MAINTENANCE</option>
            </select>
        </div>

        <div>
            <label for="feat">Nổi bật</label>
            <input type="checkbox" name="featured" id="feat" value="true">
        </div>

        <button type="button" id="submitBtn" onclick="submitField()">
            Thêm Facility
        </button>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/owner/facility.js"></script>
</body>
</html>
