<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/styles.css" rel="stylesheet">

    <title>Checkout | Sport Field Booking</title>
</head>
<body>
<div id="navbar" data-root="../../" data-role="staff" data-name="Staff A" data-active="Checkout"></div>
<main class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card soft-card p-4"><h1 class="section-title">Checkout sân</h1>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Mã booking</label><input class="form-control"
                                                                                                 value="#BK001"></div>
                        <div class="col-md-6"><label class="form-label">Phụ phí phát sinh</label><input
                                class="form-control" value="50.000đ"></div>
                        <div class="col-12"><label class="form-label">Ghi chú</label><textarea class="form-control"
                                                                                               rows="3">Thuê thêm bóng</textarea>
                        </div>
                    </div>
                </div>
            </div>
            <aside class="col-lg-4">
                <div class="card soft-card p-4"><h5>Tổng kết</h5>
                    <div class="d-flex justify-content-between"><span>Tiền sân</span><strong>300.000đ</strong></div>
                    <div class="d-flex justify-content-between"><span>Phụ phí</span><strong>50.000đ</strong></div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5"><span>Tổng</span><strong class="text-sf-primary">350.000đ</strong>
                    </div>
                    <a href="invoice.html" class="btn btn-sf-primary w-100 mt-4">Tạo hóa đơn</a></div>
            </aside>
        </div>
    </div>
</main>
<div id="footer" data-root="../../"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/app.js"></script>

</body>
</html>
